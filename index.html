<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Vidyarthi Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Gayathri:wght@400;700&family=Anek+Malayalam:wght@400;600;700&family=Chilanka&family=Baloo+Chettan+2:wght@500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen classroom app. Slim top bar, the board fills the rest, a floating tool dock at the bottom (big touch targets for a smart panel). */
:root{
  --chrome:#f3f5f2;      /* top bar + dock surface */
  --chrome-2:#e4e9e3;    /* pressed / hover */
  --ink:#1d2a26;         /* text on chrome */
  --muted:#5d6c66;
  --line:#cfd8d2;
  --accent:#0f7a63;      /* slate-teal, like a classroom board frame */
  --accent-ink:#ffffff;
  --chalk:#f2b632;       /* chalk-yellow highlight for the AI action */
  --danger:#c2412d;
  --stage:#dfe5e0;       /* around the board */
  --paperc:#f7faf8;--paperink:#1d2a26;
  --shadow:0 6px 24px rgba(20,40,32,.16),0 1px 3px rgba(20,40,32,.12);
  --f-ml:"Manjari";
  --f-display:var(--f-ml),"Noto Sans Malayalam",system-ui,sans-serif;
  --f-body:var(--f-ml),"Noto Sans Malayalam",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --chrome:#1c2522;--chrome-2:#27322e;--ink:#e9efeb;--muted:#9fb0a9;--line:#34423d;
  --accent:#3fb592;--accent-ink:#06261d;--chalk:#f5c451;--danger:#ef7b66;--stage:#121916;--paperc:#18211e;--paperink:#e9efeb;
  --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#1c2522;--chrome-2:#27322e;--ink:#e9efeb;--muted:#9fb0a9;--line:#34423d;
  --accent:#3fb592;--accent-ink:#06261d;--chalk:#f5c451;--danger:#ef7b66;--stage:#121916;--paperc:#18211e;--paperink:#e9efeb;
  --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:16px}
.grp{display:flex;align-items:center;gap:2px;background:var(--chrome-2);border-radius:12px;padding:3px}
.ib{min-width:40px;height:40px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;cursor:pointer;padding:0 8px}
.ib:hover{background:var(--chrome)}
.ib:focus-visible,.tool:focus-visible,.sw:focus-visible{outline:3px solid var(--chalk);outline-offset:1px}
.ib svg,.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[disabled]{opacity:.35;cursor:default}
.pg{font-variant-numeric:tabular-nums;font-weight:600;min-width:48px;text-align:center;font-size:14px}
.ib.warn{background:var(--danger);color:#fff}
.stage{position:relative;flex:1;min-height:0}
canvas#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 24px);z-index:5}
.bar{display:flex;align-items:center;gap:4px;background:var(--chrome);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center}
.tool{width:52px;height:52px;border:0;background:transparent;border-radius:13px;display:grid;place-items:center;cursor:pointer;position:relative}
.tool:hover{background:var(--chrome-2)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool.magic{color:#7a4c00;background:color-mix(in srgb,var(--chalk) 35%,transparent)}
.tool.magic[aria-pressed="true"]{background:var(--chalk);color:#3a2600}
.sep{width:1px;height:32px;background:var(--line);margin:0 4px}
.sub{display:flex;align-items:center;gap:10px;background:var(--chrome);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--chrome),0 0 0 5px var(--accent)}
.size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.size input{width:120px;accent-color:var(--accent)}
.dot{border-radius:50%;background:var(--ink);flex:none}
.chip{border:1px solid var(--line);background:var(--chrome-2);border-radius:10px;height:38px;min-width:40px;padding:0 10px;cursor:pointer;display:grid;place-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.float{position:absolute;z-index:6;display:flex;gap:6px}
.fbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-family:var(--f-display);font-size:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center;background:var(--chrome);color:var(--ink);border:1px solid var(--line)}
.fbtn.go{background:var(--chalk);color:#3a2600;border-color:transparent;animation:pop .25s ease-out}
.fbtn.del{color:var(--danger)}
@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}
textarea.txt{position:absolute;z-index:7;background:transparent;border:2px dashed var(--accent);border-radius:6px;outline:none;resize:none;overflow:hidden;font-family:var(--f-ml),"Noto Sans Malayalam",sans-serif;font-weight:var(--f-w,700);line-height:1.25;padding:2px 4px;min-width:120px;-webkit-user-select:text;user-select:text}
/* AI sheet */
.sheet{position:absolute;z-index:8;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--chrome);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0;font-family:var(--f-display);font-size:20px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:22px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.wordrow{display:flex;gap:6px}
.wordrow input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--stage);color:var(--ink);padding:0 12px;font-family:var(--f-display);font-size:20px}
.btn{height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 14px;cursor:pointer;font-family:var(--f-display);font-size:15px;white-space:nowrap}
.btn.ghost{background:var(--chrome-2);color:var(--ink)}
.cands{display:flex;flex-wrap:wrap;gap:6px}.cands:empty{display:none}
.cands .chip{font-family:var(--f-display);font-size:18px;height:42px}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#1d2a26}
.pick:hover,.pick:focus-visible{border-color:var(--accent);outline:none}
.pick img{width:100%;aspect-ratio:1;object-fit:contain}
.pick span{font-size:12px;color:#5d6c66}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.menu{position:absolute;z-index:9;background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:15px}
.menu button:hover,.menu button[aria-pressed="true"]{background:var(--chrome-2)}
.logo{background:#fff;border-radius:7px;padding:2px;height:32px;width:auto}
.lessbtn{display:flex;align-items:center;gap:6px;height:44px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:0 14px;font-family:var(--f-display);font-weight:600;font-size:17px;cursor:pointer}
.lessbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lesson{position:absolute;z-index:8;top:12px;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:min(480px,calc(100% - 24px));background:var(--chrome);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:text;user-select:text}
.lesson header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
.lesson header h2{margin:0;font-family:var(--f-display);font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .subs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.lesson .body{overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.unit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--stage);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px;line-height:1.4}
.unit:hover{border-color:var(--accent)}
.para{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--stage)}
.para p{margin:0 0 8px;font-size:16px;line-height:1.6;white-space:pre-line}
.para .acts{display:flex;gap:6px;flex-wrap:wrap}
.para .acts button{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--chrome);padding:0 10px;cursor:pointer;font-size:14px}
.para .acts button:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lesson .note{font-size:13px;color:var(--muted);margin:0}
.pop{position:absolute;z-index:8;width:min(360px,calc(100% - 16px));background:var(--chrome);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;animation:pop .2s ease-out}
.pop input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--stage);color:var(--ink);padding:0 12px;font-family:var(--f-display);font-size:22px}
.popbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pb{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--chrome-2);border-radius:12px;padding:10px 4px;cursor:pointer;font-size:14px;font-weight:600}
.pb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pb.ai{background:var(--chalk);color:#3a2600;border-color:transparent}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.help{position:absolute;z-index:8;inset:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto;background:var(--paperc);color:var(--paperink);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:text;user-select:text;--z:1}
.help header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--chrome);color:var(--ink)}
.help header h2{margin:0 auto 0 4px;font-family:var(--f-display);font-size:22px}
.hw{display:flex;align-items:center;background:var(--stage);border:1px solid var(--line);border-radius:10px}
.hw input{height:40px;width:min(220px,40vw);border:0;background:transparent;color:var(--ink);padding:0 10px;font-family:var(--f-display);font-size:18px}
.help select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--stage);color:var(--ink);padding:0 8px;font-size:15px}
.help .ib{font-weight:700}
.help>.cands{padding:8px 12px 0}
.htabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--chrome)}
.htabs button{flex:none;border:1px solid var(--line);background:var(--stage);color:var(--ink);border-radius:10px;height:42px;padding:0 16px;font-size:15px;cursor:pointer;font-weight:600}
.htabs button[aria-selected="true"]{background:var(--chalk);color:#3a2600;border-color:transparent}
.hbody{flex:1;overflow:auto;padding:18px clamp(14px,3vw,32px);font-size:calc(19px * var(--z));line-height:1.65}
.hbody .note{font-size:calc(14px * var(--z))}
.explain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:24px;align-items:start}
@media (max-width:700px){.explain{grid-template-columns:minmax(0,1fr)}}
.explain h3{margin:0 0 8px;font-family:var(--f-display);font-size:1.4em}
.explain p{margin:0 0 10px}.explain ul{margin:0 0 12px;padding-left:1.2em}.explain li{margin:4px 0}
.eimg{display:flex;flex-direction:column;align-items:center;gap:4px}
.eimg img{width:100%;border-radius:12px;background:#fff;cursor:pointer;border:2px solid var(--line)}
.eimg span{font-size:13px;color:var(--muted)}
.sm2{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chrome-2);color:var(--ink);padding:0 12px;margin:4px 6px 0 0;cursor:pointer;font-size:14px}
.mcq .qn{font-weight:700;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--stage);color:var(--paperink);border-radius:12px;padding:12px 14px;font-size:1em;cursor:pointer}
.opt.ok{border-color:#2e8b57;background:color-mix(in srgb,#2e8b57 18%,var(--stage))}
.opt.no{border-color:#c0392b;background:color-mix(in srgb,#c0392b 15%,var(--stage))}
.why{margin:10px 0 0;font-size:.9em;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.vlist{display:grid;gap:8px;margin-top:10px}
.vbtn{display:block;padding:14px 16px;border-radius:12px;background:var(--stage);border:1px solid var(--line);color:var(--paperink);text-decoration:none;font-weight:600}
.exl{margin:0;padding-left:1.3em}.exl li{margin:8px 0}
.keybox{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.keybox a,.settings a{color:var(--accent)}
.settings{right:12px;min-width:min(340px,calc(100% - 24px));gap:8px;padding:14px}
.settings label{display:grid;gap:4px;font-size:14px}
.settings input,.settings select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--stage);color:var(--ink);padding:0 10px}
.settings .row{display:flex;gap:6px}
.settings .btn:not(.ghost){background:var(--accent);color:var(--accent-ink)}
@media (max-width:560px){.tool{width:44px;height:44px}.brand span{display:none}.lessbtn{font-size:15px;padding:0 10px}.size input{width:90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><img src="logo.png" alt="" width="30" height="32" class="logo"><span>AMUP AI ബോർഡ്</span></div>
    <button class="lessbtn" id="lessons" type="button"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>പാഠങ്ങൾ</button>
    <div class="grp">
      <button class="ib" id="undo" title="തിരികെ (Undo)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="ib" id="redo" title="വീണ്ടും (Redo)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="ib" id="prev" aria-label="മുൻ പേജ്"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="pg" id="pg">1 / 1</div>
      <button class="ib" id="next" aria-label="അടുത്ത പേജ്"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="ib" id="addpg" title="പുതിയ പേജ്" aria-label="പുതിയ പേജ്"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="grp">
      <button class="ib" id="bgbtn" title="പശ്ചാത്തലം" aria-label="പശ്ചാത്തലം"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18"/></svg></button>
      <button class="ib" id="clear" title="പേജ് മായ്ക്കുക" aria-label="പേജ് മായ്ക്കുക"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button class="ib" id="export" title="ചിത്രമായി സേവ് ചെയ്യുക" aria-label="PNG ആയി സേവ് ചെയ്യുക"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button class="ib" id="settings" title="സെറ്റിങ്സ്" aria-label="സെറ്റിങ്സ്"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="ib" id="full" title="ഫുൾസ്ക്രീൻ" aria-label="ഫുൾസ്ക്രീൻ"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board"></canvas>

    <div class="dock">
      <div class="sub" id="sub"></div>
      <div class="bar" role="toolbar" aria-label="ടൂളുകൾ">

];

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#board'), ctx = cv.getContext('2d');
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const norm = s => (s||'').toString().trim().toLowerCase().normalize('NFC');
const svgURL = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
let toastT;
function toast(msg, ms=2600){
  let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); stage.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, ms);
}

// ---------- state ----------
const saved = store.get('vb-board-v1');
let pages = saved?.pages?.length ? saved.pages : [{bg:'chalk', objs:[]}];
let cur = Math.min(saved?.cur||0, pages.length-1);
const st = {
  tool:'pen', color: (saved ? COLORS[0] : '#ffffff'), hlColor:HL_COLORS[0],
  size:{pen:5, hl:24, eraser:36, shape:5}, shape:'rect', textSize:44,
};
const userLib = store.get('vb-lib-v1') || [];   // pictures this teacher already made with AI
let hist = pages.map(p => ({undo:[], redo:[]}));
const page = () => pages[cur];
const objs = () => pages[cur].objs;

function snapshot(){ return JSON.stringify(objs()); }
function commit(before){ // before = snapshot taken before the change
  const h = hist[cur]; h.undo.push(before); if(h.undo.length>80) h.undo.shift(); h.redo = [];
  persist(); updateTop();
}
let persistT;
function persist(){ clearTimeout(persistT); persistT = setTimeout(()=>store.set('vb-board-v1',{pages,cur}), 300); }

// ---------- images cache ----------
const imgCache = new Map();
function getImg(src){
  let im = imgCache.get(src);
  if(!im){ im = new Image(); if(/^https?:/.test(src)) im.crossOrigin='anonymous'; im.onload = () => draw(); im.src = src; imgCache.set(src, im); }
  return im;
}

// ---------- canvas sizing ----------
let W=0,H=0,DPR=1;
function resize(){
  const r = stage.getBoundingClientRect(); DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = r.width; H = r.height; cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); draw();
}
new ResizeObserver(resize).observe(stage);

// ---------- drawing ----------
function drawBg(c, bg, w, h){
  c.fillStyle = bg==='chalk' ? '#1f4a3f' : '#ffffff'; c.fillRect(0,0,w,h);
  if(bg==='grid'){ c.strokeStyle='#e3ebf3'; c.lineWidth=1; c.beginPath();
    for(let x=0;x<w;x+=40){c.moveTo(x+.5,0);c.lineTo(x+.5,h);} for(let y=0;y<h;y+=40){c.moveTo(0,y+.5);c.lineTo(w,y+.5);} c.stroke(); }
  if(bg==='lines'){ // four-line copybook for letter practice
    for(let y=60; y<h; y+=150){
      c.lineWidth=1.5; c.setLineDash([]); c.strokeStyle='#9cc3e6';
      c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.moveTo(0,y+96); c.lineTo(w,y+96); c.stroke();
      c.strokeStyle='#f0a3a3'; c.setLineDash([8,6]);
      c.beginPath(); c.moveTo(0,y+32); c.lineTo(w,y+32); c.moveTo(0,y+64); c.lineTo(w,y+64); c.stroke(); c.setLineDash([]);
    }
  }
}
function strokePath(c, o){
  const p = o.pts; if(!p.length) return;
  c.strokeStyle = o.color; c.lineCap='round'; c.lineJoin='round';
  c.globalAlpha = o.hl ? .38 : 1;
  if(p.length===1){ c.fillStyle=o.color; c.beginPath(); c.arc(p[0][0],p[0][1],o.size/2,0,7); c.fill(); c.globalAlpha=1; return; }
  const pressure = !o.hl && p.some(q=>q[2]!==.5);
  if(pressure){ // variable width: draw segment by segment
    for(let i=1;i<p.length;i++){ c.lineWidth = o.size*(.4+ (p[i][2]||.5)*1.2); c.beginPath(); c.moveTo(p[i-1][0],p[i-1][1]); c.lineTo(p[i][0],p[i][1]); c.stroke(); }
  } else {
    c.lineWidth = o.size; c.beginPath(); c.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length-1;i++){ const mx=(p[i][0]+p[i+1][0])/2, my=(p[i][1]+p[i+1][1])/2; c.quadraticCurveTo(p[i][0],p[i][1],mx,my); }
    const l=p[p.length-1]; c.lineTo(l[0],l[1]); c.stroke();
  }
  c.globalAlpha = 1;
}
function shapePath(c, o){
  const {x1,y1,x2,y2} = o; const x=Math.min(x1,x2), y=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);
  c.beginPath();
  if(o.kind==='rect') c.rect(x,y,w,h);
  else if(o.kind==='ellipse') c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);
  else if(o.kind==='tri'){ c.moveTo(x+w/2,y); c.lineTo(x+w,y+h); c.lineTo(x,y+h); c.closePath(); }
  else if(o.kind==='line'||o.kind==='arrow'){ c.moveTo(x1,y1); c.lineTo(x2,y2);
    if(o.kind==='arrow'){ const a=Math.atan2(y2-y1,x2-x1), L=Math.max(14,o.size*3.5);
      c.moveTo(x2,y2); c.lineTo(x2-L*Math.cos(a-.45),y2-L*Math.sin(a-.45)); c.moveTo(x2,y2); c.lineTo(x2-L*Math.cos(a+.45),y2-L*Math.sin(a+.45)); } }
  else if(o.kind==='star'){ const cx=x+w/2, cy=y+h/2; for(let i=0;i<10;i++){ const r = i%2? .4:1, a=-Math.PI/2+i*Math.PI/5; const px=cx+Math.cos(a)*w/2*r, py=cy+Math.sin(a)*h/2*r; i?c.lineTo(px,py):c.moveTo(px,py);} c.closePath(); }
}
const FONTS=[['Manjari',700,'മഞ്ജരി (വ്യക്തം, ഉരുണ്ടത്)'],['Gayathri',700,'ഗായത്രി'],['Anek Malayalam',600,'അനേക്'],['Noto Sans Malayalam',600,'നോട്ടോ'],['Baloo Chettan 2',600,'ബാലൂ ചേട്ടൻ (പഴയത്)'],['Chilanka',400,'ചിലങ്ക (കൈയക്ഷരം)']];
function curFont(){ const n=store.get('vb-font')||'Manjari'; return FONTS.find(f=>f[0]===n)||FONTS[0]; }
function applyFont(){ const [n,w]=curFont(); const r=document.documentElement.style; r.setProperty('--f-ml',`"${n}"`); r.setProperty('--f-w',w); document.fonts?.load?.(`${w} 40px "${n}"`).then(()=>draw()).catch(()=>{}); }
function textFont(o){ const [n,w]=curFont(); return `${w} ${o.size}px "${n}","Noto Sans Malayalam",sans-serif`; }
function drawObj(c, o){
  if(o.type==='stroke') strokePath(c,o);
  else if(o.type==='shape'){ c.strokeStyle=o.color; c.lineWidth=o.size; c.lineCap='round'; c.lineJoin='round'; shapePath(c,o); c.stroke(); }
  else if(o.type==='text'){ c.fillStyle=o.color; c.font=textFont(o); c.textBaseline='top'; o.text.split('\n').forEach((ln,i)=>c.fillText(ln,o.x,o.y+i*o.size*1.25)); }
  else if(o.type==='image'){ const im=getImg(o.src); if(im.complete && im.naturalWidth) c.drawImage(im,o.x,o.y,o.w,o.h); }
}
let live = null;       // object being drawn right now
let sel = null;        // selected object
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBg(ctx, page().bg, W, H);
  for(const o of objs()) drawObj(ctx,o);
  if(live){ if(live.magic){ ctx.save(); ctx.setLineDash([10,8]); drawObj(ctx,{...live,color:'#e0a000',size:4}); ctx.restore(); } else drawObj(ctx,live); }
  if(sel && objs().includes(sel)){
    const b = bbox(sel); ctx.save(); ctx.strokeStyle='#0f7a63'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
    ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12); ctx.setLineDash([]);
    ctx.fillStyle='#ffffff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(b.x+b.w+6,b.y+b.h+6,13,0,7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if(eraserAt){ ctx.save(); ctx.strokeStyle='rgba(120,120,120,.8)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(eraserAt[0],eraserAt[1],st.size.eraser/2,0,7); ctx.stroke(); ctx.restore(); }
  placeFloats();
}

// ---------- geometry ----------
function bbox(o){
  if(o.type==='stroke'){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const p of o.pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);} const r=o.size/2; return {x:a-r,y:b-r,w:c-a+2*r,h:d-b+2*r}; }
  if(o.type==='shape') return {x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)};
  if(o.type==='text'){ ctx.font=textFont(o); const ls=o.text.split('\n'); return {x:o.x,y:o.y,w:Math.max(...ls.map(l=>ctx.measureText(l).width),10),h:ls.length*o.size*1.25}; }
  return {x:o.x,y:o.y,w:o.w,h:o.h};
}
const inBox = (x,y,b,pad=0) => x>=b.x-pad && x<=b.x+b.w+pad && y>=b.y-pad && y<=b.y+b.h+pad;
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-ax-t*dx, py-ay-t*dy); }
function hit(o,x,y,tol=8){
  if(o.type==='stroke'){ const p=o.pts, r=o.size/2+tol; if(p.length===1) return Math.hypot(x-p[0][0],y-p[0][1])<r; for(let i=1;i<p.length;i++) if(segDist(x,y,p[i-1][0],p[i-1][1],p[i][0],p[i][1])<r) return true; return false; }
  if(o.type==='shape'){ if(o.kind==='line'||o.kind==='arrow') return segDist(x,y,o.x1,o.y1,o.x2,o.y2)<o.size/2+tol; return inBox(x,y,bbox(o),tol); }
  return inBox(x,y,bbox(o),tol);
}
function topHit(x,y){ const a=objs(); for(let i=a.length-1;i>=0;i--) if(hit(a[i],x,y,10)) return a[i]; return null; }
function pip(x,y,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
function moveObj(o,dx,dy){
  if(o.type==='stroke') o.pts.forEach(p=>{p[0]+=dx;p[1]+=dy;});
  else if(o.type==='shape'){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy;}
  else {o.x+=dx;o.y+=dy;}
}
function scaleObj(o, orig, s){ // uniform scale from the top-left of the original box
  const b = bbox(orig), ox=b.x, oy=b.y;
  if(o.type==='stroke'){ o.pts = orig.pts.map(p=>[ox+(p[0]-ox)*s, oy+(p[1]-oy)*s, p[2]]); o.size = Math.max(1,orig.size*s); }
  else if(o.type==='shape'){ ['x1','x2'].forEach(k=>o[k]=ox+(orig[k]-ox)*s); ['y1','y2'].forEach(k=>o[k]=oy+(orig[k]-oy)*s); }
  else if(o.type==='text'){ o.size = Math.max(10, orig.size*s); }
  else { o.w = Math.max(30, orig.w*s); o.h = Math.max(30, orig.h*s); }
}
// Eraser: cut strokes where the eraser passes; remove shapes and text it touches. Pictures stay (delete them with Select).
function eraseAt(x,y){
  const r = st.size.eraser/2; const a = objs(); let changed=false; const out=[];
  for(const o of a){
    if(o.type==='stroke'){
      if(!inBox(x,y,bbox(o),r)){ out.push(o); continue; }
      let seg=[], parts=[];
      for(const p of o.pts){ if(Math.hypot(p[0]-x,p[1]-y) < r + o.size/2*.6){ if(seg.length) parts.push(seg); seg=[]; changed=true; } else seg.push(p); }
      if(seg.length) parts.push(seg);
      if(parts.length===1 && parts[0].length===o.pts.length){ out.push(o); continue; }
      parts.forEach(pp=>out.push({...o, pts:pp}));
    } else if(o.type!=='image' && hit(o,x,y,r)){ changed=true; }
    else out.push(o);
  }
  if(changed){ page().objs = out; }
  return changed;
}

// ---------- pointer handling ----------
let ptr=null, start=null, before=null, drag=null, eraserAt=null, magicPending=null;
const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
cv.addEventListener('pointerdown', e => {
  if(ptr!==null) return; // ignore second finger / palm while drawing
  closeMenus(); hideMagicChip(); closePop();
  ptr = e.pointerId; cv.setPointerCapture(ptr);
  const [x,y] = pos(e); start=[x,y]; before = snapshot();
  const t = st.tool, pr = e.pointerType==='pen' ? (e.pressure||.5) : .5;
  if(t==='pen'||t==='magic') live = {type:'stroke', pts:[[x,y,pr]], color:st.color, size:st.size.pen, magic:t==='magic'};
  else if(t==='hl') live = {type:'stroke', pts:[[x,y,.5]], color:st.hlColor, size:st.size.hl, hl:true};
  else if(t==='shape') live = {type:'shape', kind:st.shape, x1:x,y1:y,x2:x,y2:y, color:st.color, size:st.size.shape};
  else if(t==='eraser'){ eraserAt=[x,y]; eraseAt(x,y); draw(); }
  else if(t==='text'){ ptr=null; openTextEditor(x,y); return; }
  else if(t==='select'){
    if(sel){ const b=bbox(sel); if(Math.hypot(x-(b.x+b.w+6), y-(b.y+b.h+6))<24){ drag={mode:'scale', orig:JSON.parse(JSON.stringify(sel)), b}; return; } }
    const o = topHit(x,y); sel = o; drag = o ? {mode:'move', last:[x,y]} : null; draw();
  }
});
cv.addEventListener('pointermove', e => {
  if(st.tool==='eraser' && ptr===null){ eraserAt=pos(e); draw(); return; }
  if(e.pointerId!==ptr) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  const t = st.tool;
  if(live?.type==='stroke'){ for(const ev of (evs.length?evs:[e])){ const [x,y]=pos(ev); const l=live.pts[live.pts.length-1]; if(Math.hypot(x-l[0],y-l[1])>1.2) live.pts.push([x,y, ev.pointerType==='pen'?(ev.pressure||.5):.5]); } draw(); }
  else if(live?.type==='shape'){ const [x,y]=pos(e); live.x2=x; live.y2=y; draw(); }
  else if(t==='eraser'){ const [x,y]=pos(e); eraserAt=[x,y]; eraseAt(x,y); draw(); }
  else if(drag?.mode==='move' && sel){ const [x,y]=pos(e); moveObj(sel,x-drag.last[0],y-drag.last[1]); drag.last=[x,y]; draw(); }
  else if(drag?.mode==='scale' && sel){ const [x,y]=pos(e); const b=drag.b; const s=Math.max(.15, Math.max((x-b.x)/Math.max(b.w,1),(y-b.y)/Math.max(b.h,1))); scaleObj(sel, drag.orig, s); draw(); }
});
function endPointer(e){
  if(e.pointerId!==ptr) return; ptr=null;
  const t = st.tool;
  if(live){
    const o = live; live = null;
    if(o.type==='shape' && Math.hypot(o.x2-o.x1,o.y2-o.y1)<6){ draw(); return; }
    if(o.magic){ delete o.magic; const inside = enclosed(o); if(inside.length) runMagic(inside); else toast('വാക്ക് എഴുതിയ ശേഷം അതിനെ ചുറ്റി വട്ടമിടൂ'); draw(); return; }
    objs().push(o); commit(before);
    if(t==='pen'){ const inside = isLoop(o) ? enclosed(o) : []; if(inside.length) showMagicChip(o, inside); }
  } else if(t==='eraser'){ if(snapshot()!==before) commit(before); }
  else if(t==='select' && drag){ if(snapshot()!==before) commit(before); drag=null; }
  draw();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { if(st.tool==='eraser' && ptr===null){ eraserAt=null; draw(); } });

// ---------- circle gesture ----------
function isLoop(o){
  const p=o.pts; if(p.length<14) return false; const b=bbox(o); if(b.w<50||b.h<35) return false;
  return Math.hypot(p[0][0]-p[p.length-1][0], p[0][1]-p[p.length-1][1]) < Math.max(45, .3*Math.hypot(b.w,b.h));
}
function enclosed(loop){
  const poly = loop.pts.map(p=>[p[0],p[1]]);
  return objs().filter(o => o!==loop && o.type==='stroke' && !o.hl && o.pts.filter(p=>pip(p[0],p[1],poly)).length >= o.pts.length*.7);
}
let chipEl=null, selEl=null;
function showMagicChip(loop, inside){
  hideMagicChip(); magicPending = {loop, inside};
  chipEl = document.createElement('div'); chipEl.className='float';
  const b = bbox(loop);
  chipEl.innerHTML = `<button class="fbtn go" type="button">✨ AI സഹായം</button>`;
  chipEl.style.left = Math.min(W-220, Math.max(8, b.x)) + 'px'; chipEl.style.top = Math.max(8, b.y-58) + 'px';
  chipEl.firstChild.onclick = () => { const m = magicPending; hideMagicChip(); const before=snapshot(); page().objs = objs().filter(o=>o!==m.loop); commit(before); draw(); runMagic(m.inside); };
  stage.appendChild(chipEl);
  magicPending.timer = setTimeout(hideMagicChip, 7000);
}
function hideMagicChip(){ if(chipEl){ chipEl.remove(); chipEl=null; } if(magicPending){ clearTimeout(magicPending.timer); magicPending=null; } }

// floating buttons for a selected object
function placeFloats(){
  if(!(sel && objs().includes(sel) && st.tool==='select')){ if(selEl){ selEl.remove(); selEl=null; } return; }

}

function openTextEditor(x,y){
  const ta = document.createElement('textarea'); ta.className='txt'; ta.id='txt-input';
  ta.style.left=x+'px'; ta.style.top=y+'px'; ta.style.fontSize=st.textSize+'px'; ta.style.color=st.color; ta.rows=1;
  ta.setAttribute('aria-label','ടെക്സ്റ്റ് എഴുതുക');
  stage.appendChild(ta); setTimeout(()=>ta.focus(),0);
  const fit = () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; ta.style.width=Math.min(W-x-8, Math.max(140, ta.value.split('\n').reduce((m,l)=>Math.max(m,l.length),0)*st.textSize*.62+30))+'px'; };
  ta.addEventListener('input', fit); fit();
  let done=false;
  const finish = () => { if(done) return; done=true; const v = ta.value.replace(/\s+$/,''); ta.remove();
    if(v){ const before=snapshot(); objs().push({type:'text', x:x+6, y:y+4, text:v, size:st.textSize, color:st.color}); commit(before); draw(); } };
  ta.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); finish(); } if(e.key==='Escape'){ ta.value=''; finish(); } });
  ta.addEventListener('blur', finish);
}

const use = n => (window.claude?.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null));
// ---------- picture from handwriting (free services, no key) ----------
// 1) Google handwriting input (the same free service behind the Malayalam handwriting keyboard) reads the circled word.
// 2) Wikipedia / Wikimedia Commons give real pictures for it. Both need internet; the small built-in library works offline.
const isML = s => /[ഀ-ൿ]/.test(s||'');
async function readHandwriting(strokes, lang){
  const ink = strokes.map(o => [o.pts.map(p=>Math.round(p[0])), o.pts.map(p=>Math.round(p[1])), o.pts.map((_,i)=>i*12)]);
  const body = {options:'enable_pre_space', requests:[{writing_guide:{writing_area_width:Math.round(W), writing_area_height:Math.round(H)}, ink, language:lang}]};
  const r = await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json();
  if(j[0]!=='SUCCESS') throw new Error('hw');
  return (j[1]?.[0]?.[1] || []).slice(0,5);
}
const wapi = (host, params) => fetch(`https://${host}/w/api.php?format=json&origin=*&${new URLSearchParams(params)}`).then(r=>r.json());
async function findPictures(word){
  const out = [], seen = new Set();
  const add = (url, tag, w, h) => { if(url && !seen.has(url) && !/\.svg\.png$/i.test('') ){ seen.add(url); out.push({url, tag, w, h}); } };
  let en = isML(word) ? '' : word;
  const lang = isML(word) ? 'ml' : 'en';
  try{
    const j = await wapi(`${lang}.wikipedia.org`, {action:'query', titles:word, redirects:1, prop:'pageimages|langlinks', piprop:'thumbnail', pithumbsize:600, lllang:'en', lllimit:1});
    for(const p of Object.values(j.query?.pages||{})){ if(p.thumbnail) add(p.thumbnail.source, 'വിക്കിപീഡിയ', p.thumbnail.width, p.thumbnail.height); if(p.langlinks?.[0]) en = p.langlinks[0]['*']; }
  }catch{}
  if(lang==='ml' && en){ try{
    const j = await wapi('en.wikipedia.org', {action:'query', titles:en, redirects:1, prop:'pageimages', piprop:'thumbnail', pithumbsize:600});
    for(const p of Object.values(j.query?.pages||{})) if(p.thumbnail) add(p.thumbnail.source, 'Wikipedia', p.thumbnail.width, p.thumbnail.height);
  }catch{} }
  try{
    const j = await wapi('commons.wikimedia.org', {action:'query', generator:'search', gsrsearch:`${en||word} filetype:bitmap|drawing`, gsrnamespace:6, gsrlimit:10, prop:'imageinfo', iiprop:'url|mime', iiurlwidth:500});
    Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index).forEach(p=>{ const ii=p.imageinfo?.[0]; if(ii?.thumburl) add(ii.thumburl,'Commons', ii.thumbwidth, ii.thumbheight); });
  }catch{}
  return {pics: out.slice(0,10), en};
}
function libFind(word){
  const w = norm(word); if(!w) return [];
  return LIB.filter(it => norm(it.ml)===w || norm(it.en)===w);
}

async function runMagic(strokes){
  magicBox = renderBox(strokes); closePop();

function busy(msg){ return `<div class="status"><span class="spin"></span>${msg}</div>`; }

async function renderTab(){

    const {pics} = await findPictures(word).catch(()=>({pics:[]}));
    if(id!==helpId) return;

function renderMCQ(body, qs){
  if(!qs.length){ body.innerHTML='<p class="note">ചോദ്യങ്ങൾ കിട്ടിയില്ല.</p>'; return; }
  let i=0, score=0;
  const show = () => {
    const q = qs[i]; body.innerHTML = `<div class="mcq"><p class="qn"></p><div class="opts"></div><p class="why" hidden></p><div class="mrow"><span class="note">${i+1} / ${qs.length} · ശരി: ${score}</span><button type="button" class="btn" hidden>${i<qs.length-1?'അടുത്തത് →':'വീണ്ടും തുടങ്ങുക'}</button></div></div>`;
    body.querySelector('.qn').textContent = `${i+1}. ${q.q}`;
    const box = body.querySelector('.opts'), nx = body.querySelector('.mrow .btn'), why = body.querySelector('.why');
    (q.options||[]).forEach((o,j)=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=`${'ABCD'[j]}) ${o}`;
      b.onclick=()=>{ if(box.dataset.done) return; box.dataset.done=1; box.children[q.answer]?.classList.add('ok'); if(j!==q.answer) b.classList.add('no'); else score++; why.textContent=q.why||''; why.hidden=!q.why; nx.hidden=false; body.querySelector('.mrow .note').textContent=`${i+1} / ${qs.length} · ശരി: ${score}`; };
      box.appendChild(b); });
    nx.onclick = () => { if(i<qs.length-1){ i++; } else { i=0; score=0; } show(); };
  };
  show();
}

}
async function aiHelp(word){
  const k = word+'|'+prefs.lang; if(aiCache.has(k)) return aiCache.get(k);
  const prompt = `You help a primary school teacher in Kerala, India teach Class 4 children (age 9) on a classroom board.
Topic word: "${word}".
Write everything in ${langName()}${prefs.lang==='ml'?' (simple Kerala classroom Malayalam, Unicode)':''}. Use short sentences and examples from Kerala village and school life.
Return only JSON:
{"title": "topic name", "explanation": {"intro": "2-3 simple sentences", "points": ["4 to 6 short key points"]},
 "mcq": [{"q": "question", "options": ["4 options"], "answer": 0, "why": "one-line reason"}],
 "examples": ["4 to 5 real-life examples a 9-year-old in Kerala will know"]}
Give 5 MCQs; "answer" is the index (0-3) of the correct option.`;
  const models = ['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash'];
  let lastErr;
  for(const m of models){
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':geminiKey()}, body:JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:{responseMimeType:'application/json', temperature:0.6}})});
      const j = await r.json();
      if(!r.ok){ lastErr = new Error(j?.error?.status==='RESOURCE_EXHAUSTED' ? 'ഇന്നത്തെ സൗജന്യ പരിധി കഴിഞ്ഞു' : r.status===400||r.status===403 ? 'key ശരിയല്ല' : (j?.error?.message||'HTTP '+r.status)); if(r.status===404) continue; throw lastErr; }
      const txt = j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '';
      const data = JSON.parse(txt.replace(/^```json\s*|```\s*$/g,''));
      aiCache.set(k, data); return data;
    }catch(e){ lastErr = e; if(!/HTTP 404/.test(e.message||'')) break; }
  }
  throw lastErr || new Error('AI');
}

function renderBox(strokes){
  let a=1e9,b=1e9,c=-1e9,d=-1e9; strokes.forEach(o=>{const bb=bbox(o); a=Math.min(a,bb.x);b=Math.min(b,bb.y);c=Math.max(c,bb.x+bb.w);d=Math.max(d,bb.y+bb.h);});
  return {x:a,y:b,w:c-a,h:d-b};
}

function placePicture(src, word, nw, nh){
  const before = snapshot(); const b = magicBox || {x:W/2-100,y:H/2-100,w:0,h:0};

function unitSort(a,b){ const n=x=>+(x.match(/\d+/)||[0])[0]; return n(a)-n(b); }
function cleanText(t){
  return t.split('\n').filter(l=>!/^\s*(IV|Environmental Science|Mathematics|English|\d{1,3})\s*$/.test(l)).join('\n')
    .split(/\n\s*\n+/).map(x=>x.replace(/[.\-]{6,}/g,' ……… ').trim()).filter(x=>x.length>1)
    .flatMap(block=>{ if(block.length<=360) return [block]; const out=[]; let cur=''; for(const ln of block.split('\n')){ if(cur && (cur+ln).length>300){ out.push(cur.trim()); cur=''; } cur+=ln+'\n'; } if(cur.trim()) out.push(cur.trim()); return out; });
}
function wrapForBoard(text, size, maxW){
  ctx.font = textFont({size}); const out=[];
  let line=''; for(const w of text.replace(/\s*\n\s*/g,' ').split(' ')){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; } if(line) out.push(line);
  return out.join('\n');
}
function nextFreeY(){ let y=24; for(const o of objs()){ const b=bbox(o); y=Math.max(y,b.y+b.h+16); } return y; }
function addTextToBoard(text, size){
  const before=snapshot(); const x = lessonEl ? Math.min(W*0.42, 500) : 40;
  const maxW = Math.max(260, W - x - 40);
  const t = wrapForBoard(text, size, maxW), hgt = t.split('\n').length*size*1.25;
  let y = nextFreeY();
  if(objs().length && y + hgt > H - 150){ $('#addpg').click(); y = 24; }
  const b2 = snapshot();
  objs().push({type:'text', x, y, text:t, size, color:page().bg==='chalk'?(st.color==='#1d2a26'?'#ffffff':st.color):(st.color==='#ffffff'?COLORS[0]:st.color)});
  commit(y===24 && objs().length===1 ? b2 : before); draw();
}
function wordsOf(text){
  const stop=new Set(['the','and','are','was','you','your','they','this','that','with','have','what','from','for','its','can','his','her','their','them','there','these','those','which','who','how','why','when','will','into','about','all','not','but','has','had','did','does','our','out','one','two','some','any','may','very','also','then','than','write','name','names']);
  const ws = (text.match(/[\p{L}\p{M}]+/gu)||[]).filter(w=>w.length>2 && !stop.has(w.toLowerCase()));
  return [...new Set(ws)].slice(0,14);
}
async function openLessons(){
  if(lessonEl){ lessonEl.remove(); lessonEl=null; return; }
  lessonEl = document.createElement('section'); lessonEl.className='lesson'; lessonEl.setAttribute('aria-label','4ാം ക്ലാസ് പാഠങ്ങൾ');
  lessonEl.innerHTML = `<header><button class="ib" id="ls-back" type="button" aria-label="പിന്നോട്ട്" hidden><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><h2 id="ls-title">4ാം ക്ലാസ് പാഠങ്ങൾ</h2><button class="ib" id="ls-close" type="button" aria-label="അടയ്ക്കുക"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="subs" id="ls-subs"></div><div class="body" id="ls-body"><div class="status"><span class="spin"></span>പാഠങ്ങൾ എടുക്കുന്നു…</div></div>`;
  stage.appendChild(lessonEl);
  $('#ls-close').onclick = () => { lessonEl.remove(); lessonEl=null; };
  $('#ls-back').onclick = () => showUnits();
  try{ await loadBook(); showUnits(); }
  catch{ $('#ls-body').innerHTML = '<p class="note">പാഠങ്ങൾ തുറക്കാൻ പറ്റിയില്ല. ഇന്റർനെറ്റ് നോക്കി വീണ്ടും ശ്രമിക്കൂ.</p>'; }
}
function showUnits(){
  if(!lessonEl) return; $('#ls-back').hidden=true; $('#ls-title').textContent='4ാം ക്ലാസ് പാഠങ്ങൾ';
  const subs=$('#ls-subs'); subs.hidden=false;
  subs.innerHTML = SUBJECTS.map(([k,n])=>`<button class="chip" type="button" data-s="${k}" aria-pressed="${k===lessonSubj}">${n}</button>`).join('');
  subs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ lessonSubj=b.dataset.s; showUnits(); });
  const keys = Object.keys(BOOK).filter(k=>k.startsWith(lessonSubj+'|')).map(k=>k.split('|')[1]).sort(unitSort);
  const body=$('#ls-body'); body.innerHTML='';
  keys.forEach(u=>{ const b=document.createElement('button'); b.type='button'; b.className='unit'; b.textContent=u; b.onclick=()=>showUnit(u); body.appendChild(b); });
  body.insertAdjacentHTML('beforeend','<p class="note">പാഠപുസ്തക ഉള്ളടക്കം വിദ്യ@AMUP ആപ്പിൽ നിന്ന്.</p>');
}
function showUnit(u){
  $('#ls-back').hidden=false; $('#ls-title').textContent=u; $('#ls-subs').hidden=true;
  const body=$('#ls-body'); body.innerHTML='';
  const top=document.createElement('div'); top.className='para';
  top.innerHTML='<p><b></b></p><div class="acts"><button type="button">പുതിയ പേജിൽ തലക്കെട്ട്</button></div>';
  top.querySelector('b').textContent=u;
  top.querySelector('button').onclick=()=>{ $('#addpg').click(); const before=snapshot(); objs().push({type:'text',x:Math.min(W*0.42,500),y:24,text:wrapForBoard(u,48,Math.max(260,W-Math.min(W*0.42,500)-40)),size:48,color:page().bg==='chalk'?'#ffe066':'#1f5fbf'}); commit(before); draw(); };
  body.appendChild(top);
  cleanText(BOOK[lessonSubj+'|'+u]||'').forEach(txt=>{
    const d=document.createElement('div'); d.className='para';
    const p=document.createElement('p'); p.textContent=txt;
    const a=document.createElement('div'); a.className='acts';
    const b1=document.createElement('button'); b1.type='button'; b1.textContent='ബോർഡിലേക്ക്'; b1.onclick=()=>addTextToBoard(txt, 30);
    const b2=document.createElement('button'); b2.type='button'; b2.textContent='✨ AI സഹായം'; b2.onclick=()=>{ const ws=wordsOf(txt); magicBox=null; openHelp(ws[0]||'', 'images', ws); };
    a.append(b1,b2); d.append(p,a); body.appendChild(d);
  });
  body.scrollTop=0;
}
$('#lessons').onclick = openLessons;
$('#settings').onclick = e => { e.stopPropagation(); if(menuEl){ closeMenus(); return; } openSettings(); };
